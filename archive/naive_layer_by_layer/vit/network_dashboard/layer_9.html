    <div style="position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(30,30,30,0.8); backdrop-filter: blur(5px); padding: 15px; border-radius: 12px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">

        <select id="percentSelect" onchange="filterGraph()" style="margin-top: 8px; width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #555; border-radius: 6px; outline: none; cursor: pointer;">
            <option value="1.0">Show All</option>
            <option value="0.05">Top 5%</option>
            <option value="0.10">Top 10%</option>
            <option value="0.20">Top 20%</option>
            <option value="0.40">Top 40%</option>
            <option value="0.60">Top 60%</option>
        </select>
    </div>
    <script type="text/javascript">
        function filterGraph() {
            var percent = parseFloat(document.getElementById('percentSelect').value);
            var allEdges = network.body.data.edges.get();
            var values = allEdges.map(function(e) { return e.value; });
            values.sort(function(a, b){return b - a});
            var thresholdIdx = Math.floor(values.length * percent);
            if (thresholdIdx >= values.length) thresholdIdx = values.length - 1;
            var threshold = values[thresholdIdx];
            var edgeUpdates = [];
            for (var i = 0; i < allEdges.length; i++) {
                var edge = allEdges[i];
                if (edge.value >= threshold) {
                    edgeUpdates.push({id: edge.id, hidden: false});
                } else {
                    edgeUpdates.push({id: edge.id, hidden: true});
                }
            }
            network.body.data.edges.update(edgeUpdates);
        }
        function resetNodes() {
            var allNodes = network.body.data.nodes.get();
            var updates = [];
            allNodes.forEach(function(n) {
                if (n.dimColor) { updates.push({id: n.id, color: { background: n.dimColor, border: n.dimColor }}); }
            });
            network.body.data.nodes.update(updates);
        }
        function highlightNodes(nodeIds) {
            var allNodes = network.body.data.nodes.get(nodeIds);
            var updates = [];
            allNodes.forEach(function(n) {
                if (n.brightColor) { updates.push({id: n.id, color: { background: n.brightColor, border: '#ffffff' }}); }
            });
            network.body.data.nodes.update(updates);
        }
        network.on("hoverNode", function (params) {
            var connected = network.getConnectedNodes(params.node);
            highlightNodes([params.node].concat(connected));
        });
        network.on("blurNode", function (params) { resetNodes(); });
        network.on("hoverEdge", function (params) {
            var edge = network.body.data.edges.get(params.edge);
            highlightNodes([edge.from, edge.to]);
        });
        network.on("blurEdge", function (params) { resetNodes(); });
        network.on("selectNode", function(params) {
            if (params.nodes.length > 0) {
                var connected = network.getConnectedNodes(params.nodes[0]);
                highlightNodes([params.nodes[0]].concat(connected));
            }
        });
    </script>
