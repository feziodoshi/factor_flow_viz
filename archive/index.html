<!DOCTYPE html>
<meta charset="utf-8">
<style>
  body { margin: 0; overflow: hidden; }
  .link { stroke: rgba(0,0,0,0.2); stroke-width: 1px; }
  .node { stroke: #fff; stroke-width: 0.5px; }
</style>
<body>
<svg id="svg"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#svg")
    .attr("width", width)
    .attr("height", height);

d3.json("modes_layer3_graph.json").then(data => {
  const color = d3.scaleOrdinal(d3.schemeTableau10);

  const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.id).distance(30))
      .force("charge", d3.forceManyBody().strength(-30))
      .force("center", d3.forceCenter(width / 2, height / 2));

  const link = svg.append("g")
      .attr("class", "links")
    .selectAll("line")
    .data(data.links)
    .enter().append("line")
      .attr("class", "link");

  const node = svg.append("g")
      .attr("class", "nodes")
    .selectAll("circle")
    .data(data.nodes)
    .enter().append("circle")
      .attr("class", "node")
      .attr("r", 3)
      .attr("fill", d => color(d.head))   // color by head or layer
      .call(drag(simulation))
      .append("title")
        .text(d => `L=${d.layer}, H=${d.head}, M=${d.mode}`);

  simulation.on("tick", () => {
    link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    svg.selectAll("circle")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);
  });

  function drag(simulation) {
    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x; d.fy = event.y;
    }
    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }
    return d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended);
  }
});
</script>
</body>
