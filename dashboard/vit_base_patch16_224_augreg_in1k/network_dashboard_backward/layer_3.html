    <script type="text/javascript">
        var SOURCE_LAYER = 3;

        // ---------- adjacency maps ----------
        function buildOutMap() {
          var out = {};
          var allEdges = network.body.data.edges.get();
          for (var i=0; i<allEdges.length; i++) {
            var e = allEdges[i];
            if (e.hidden) continue;
            if (!out[e.from]) out[e.from] = [];
            out[e.from].push({to: e.to, value: e.value, edgeId: e.id});
          }
          Object.keys(out).forEach(function(k){
            out[k].sort(function(a,b){ return b.value - a.value; });
          });
          return out;
        }

        function buildInMap() {
          var inn = {};
          var allEdges = network.body.data.edges.get();
          for (var i=0; i<allEdges.length; i++) {
            var e = allEdges[i];
            if (e.hidden) continue;
            if (!inn[e.to]) inn[e.to] = [];
            inn[e.to].push({from: e.from, value: e.value, edgeId: e.id});
          }
          Object.keys(inn).forEach(function(k){
            inn[k].sort(function(a,b){ return b.value - a.value; });
          });
          return inn;
        }

        var OUT_MAP = buildOutMap();
        var IN_MAP  = buildInMap();

        function nodeTitle(nid) {
          var n = network.body.data.nodes.get(nid);
          if (!n) return String(nid);
          return (n.title || String(nid));
        }

        function nodeLayer(nid) {
          var n = network.body.data.nodes.get(nid);
          if (!n) return null;
          // we stored 'layer' in node data via nx attr
          return (typeof n.layer === "number") ? n.layer : null;
        }

        function isSourceLayerNode(nid) {
          var L = nodeLayer(nid);
          return (L !== null) && (L === SOURCE_LAYER);
        }

        // ---------- drawers ----------
        function showOutDrawerForNode(nodeId, topK) {
          topK = topK || 30;
          var drawer = document.getElementById("edgeDrawer");
          var title = document.getElementById("edgeDrawerTitle");
          var sub = document.getElementById("edgeDrawerSub");
          var list = document.getElementById("edgeList");

          var outs = OUT_MAP[nodeId] || [];
          drawer.style.display = "block";

          title.textContent = nodeTitle(nodeId).replace(/\|/g, " | ");
          sub.textContent = outs.length ? ("Top outgoing targets: " + Math.min(topK, outs.length) + " / " + outs.length)
                                        : "No outgoing edges for this node (in the current filtered graph).";

          list.innerHTML = "";
          if (!outs.length) return;

          var vmax = outs[0].value;

          for (var i=0; i<Math.min(topK, outs.length); i++) {
            (function(item){
              var toTitle = nodeTitle(item.to).replace(/\|/g, " | ");
              var pct = vmax > 0 ? (100.0 * item.value / vmax) : 0.0;

              var row = document.createElement("div");
              row.className = "edgeRow";
              row.onclick = function() {
                network.focus(item.to, {scale: 1.8, animation: {duration: 450}});
                network.selectNodes([item.to]);
              };

              var left = document.createElement("div");
              left.className = "edgeRowLeft";
              var to = document.createElement("div");
              to.className = "edgeRowTo";
              to.textContent = toTitle;
              var meta = document.createElement("div");
              meta.className = "edgeRowMeta";
              meta.textContent = "to node id: " + item.to;
              left.appendChild(to); left.appendChild(meta);

              var right = document.createElement("div");
              right.className = "edgeRowRight";
              var score = document.createElement("div");
              score.className = "edgeScore";
              score.textContent = "score: " + item.value.toFixed(4);
              var barW = document.createElement("div");
              barW.className = "barWrap";
              var barF = document.createElement("div");
              barF.className = "barFill";
              barF.style.width = pct.toFixed(1) + "%";
              barW.appendChild(barF);
              right.appendChild(score);
              right.appendChild(barW);

              row.appendChild(left);
              row.appendChild(right);
              list.appendChild(row);
            })(outs[i]);
          }
        }

        function showInDrawerForTarget(targetId, topK) {

          list.innerHTML = "";
          if (!ins.length) return;

          var vmax = ins[0].value;

          for (var i=0; i<Math.min(topK, ins.length); i++) {
            (function(item){
              var fromTitle = nodeTitle(item.from).replace(/\|/g, " | ");
              var pct = vmax > 0 ? (100.0 * item.value / vmax) : 0.0;

              var row = document.createElement("div");
              row.className = "edgeRow";
              row.onclick = function() {
                network.focus(item.from, {scale: 1.8, animation: {duration: 450}});
                network.selectNodes([item.from]);
              };

              var left = document.createElement("div");

        function hideOutDrawer() {

        function hideInDrawer() {
          document.getElementById("inDrawer").style.display = "none";
        }

        // ---------- filtering ----------
        function filterGraph() {
            var percent = parseFloat(document.getElementById('percentSelect').value);
            var allEdges = network.body.data.edges.get();
            if (allEdges.length === 0) return;

            var values = allEdges.map(function(e) { return e.value; });
            values.sort(function(a, b){return b - a});
            var thresholdIdx = Math.floor(values.length * percent);
            if (thresholdIdx >= values.length) thresholdIdx = values.length - 1;
            var threshold = values[thresholdIdx];

            var edgeUpdates = [];
            for (var i = 0; i < allEdges.length; i++) {
                var edge = allEdges[i];
                edgeUpdates.push({id: edge.id, hidden: !(edge.value >= threshold)});
            }
            network.body.data.edges.update(edgeUpdates);

            OUT_MAP = buildOutMap();
            IN_MAP  = buildInMap();
        }

        // ---------- highlighting ----------
        function resetNodes() {
            var allNodes = network.body.data.nodes.get();
            var updates = [];
            allNodes.forEach(function(n) {
                if (n.dimColor) updates.push({id: n.id, color: { background: n.dimColor, border: n.dimColor }});
            });
            network.body.data.nodes.update(updates);
        }

        function highlightNodes(nodeIds) {
            var allNodes = network.body.data.nodes.get(nodeIds);
            var updates = [];
            allNodes.forEach(function(n) {
                // IMPORTANT: ensure all nodes have brightColor (we set it in Python for all involved nodes)
                if (n.brightColor) updates.push({id: n.id, color: { background: n.brightColor, border: '#ffffff' }});
            });
            network.body.data.nodes.update(updates);
        }

        network.on("hoverNode", function (params) {
            var connected = network.getConnectedNodes(params.node);
            highlightNodes([params.node].concat(connected));
        });
        network.on("blurNode", function (params) { resetNodes(); });

        network.on("hoverEdge", function (params) {
            var edge = network.body.data.edges.get(params.edge);
            highlightNodes([edge.from, edge.to]);
        });
        network.on("blurEdge", function (params) { resetNodes(); });

        // Selection logic:
        // - If you select a SOURCE layer node => show bottom (outgoing) drawer
        // - If you select an EARLIER layer node => show right (incoming-from-source) drawer
        network.on("selectNode", function(params) {
            if (!params.nodes.length) return;
            var nid = params.nodes[0];

            if (isSourceLayerNode(nid)) {
                var connected = network.getConnectedNodes(nid);
                highlightNodes([nid].concat(connected));
                showOutDrawerForNode(nid, 30);
            } else {
                var ins = (IN_MAP[nid] || []).filter(function(x){ return nodeLayer(x.from) === SOURCE_LAYER; });
                var srcs = ins.map(function(x){ return x.from; });
                highlightNodes([nid].concat(srcs));
                showInDrawerForTarget(nid, 30);
            }
        });

        network.on("selectEdge", function(params) {
            if (!params.edges.length) return;
            var e = network.body.data.edges.get(params.edges[0]);
            highlightNodes([e.from, e.to]);
            // if edge is from source layer, keep bottom drawer relevant
            if (isSourceLayerNode(e.from)) {
                showOutDrawerForNode(e.from, 30);
            } else {
                showInDrawerForTarget(e.to, 30);
            }
        });
    </script>
    </body>
</html>
