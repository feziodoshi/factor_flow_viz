
    <!DOCTYPE html>
    <html>
    <head>
        <title>Neural Network Flow Dashboard</title>
        <style>
            body { margin: 0; padding: 0; background-color: #111; color: #eee; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
            
            /* Sidebar Style */
            #sidebar {
                width: 220px;
                background-color: #0a0a0a;
                border-right: 1px solid #333;
                display: flex;
                flex-direction: column;
                padding: 10px;
                box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            }
            
            h2 { text-align: center; color: #fff; font-weight: 300; margin-bottom: 20px; }
            
            .nav-btn {
                background: #222;
                color: #aaa;
                border: 1px solid #333;
                padding: 12px;
                margin-bottom: 8px;
                cursor: pointer;
                text-align: left;
                border-radius: 4px;
                transition: all 0.2s;
                font-size: 14px;
            }
            
            .nav-btn:hover { background: #333; color: white; border-color: #555; }
            .nav-btn.active { background: #2ca02c; color: white; border-color: #2ca02c; font-weight: bold; }
            
            /* Main Content Area */
            #main { flex-grow: 1; position: relative; }
            
            iframe { width: 100%; height: 100%; border: none; display: block; }
        </style>
    </head>
    <body>
    
        <div id="sidebar">
            <h2>Source Layers</h2>
            <button onclick="loadLayer('layer_0.html')" class="nav-btn">Layer 0</button>
<button onclick="loadLayer('layer_1.html')" class="nav-btn">Layer 1</button>
<button onclick="loadLayer('layer_2.html')" class="nav-btn">Layer 2</button>
<button onclick="loadLayer('layer_3.html')" class="nav-btn">Layer 3</button>
<button onclick="loadLayer('layer_4.html')" class="nav-btn">Layer 4</button>
<button onclick="loadLayer('layer_5.html')" class="nav-btn">Layer 5</button>
<button onclick="loadLayer('layer_6.html')" class="nav-btn">Layer 6</button>
<button onclick="loadLayer('layer_7.html')" class="nav-btn">Layer 7</button>
<button onclick="loadLayer('layer_8.html')" class="nav-btn">Layer 8</button>
<button onclick="loadLayer('layer_9.html')" class="nav-btn">Layer 9</button>
<button onclick="loadLayer('layer_10.html')" class="nav-btn">Layer 10</button>

        </div>
        
        <div id="main">
            <iframe id="graphFrame" src="layer_0.html"></iframe>
        </div>

        <script>
            function loadLayer(filename) {
                document.getElementById('graphFrame').src = filename;
                
                // Update active button state
                var buttons = document.getElementsByClassName('nav-btn');
                for(var i=0; i<buttons.length; i++) {
                    buttons[i].classList.remove('active');
                    if(buttons[i].getAttribute('onclick').includes(filename)) {
                        buttons[i].classList.add('active');
                    }
                }
            }
            
            // Set initial active state
            loadLayer('layer_0.html');
        </script>
    </body>
    </html>
